[package]
name = "physical-panorama-cosmic"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet", "dbus-config", "a11y"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
# Already in the lock through libcosmic; encodes headless review screenshots.
png = "0.18"

[profile.release]
strip = true
debug = 0

[profile.dev]
debug = 0
