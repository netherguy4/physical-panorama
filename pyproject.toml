[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-panorama"
version = "0.1.0"
description = "Span one panorama across several monitors at true physical scale on COSMIC"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["Pillow>=9.1"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/netherguy4/physical-panorama"

[project.scripts]
physical-panorama = "physical_panorama:cli"

[tool.setuptools]
py-modules = ["physical_panorama"]
